<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · English Coach</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #faf8f5; color: #1b1b2f; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #12121c; color: #f1f0fa; } p { color: #a5a5bd; } }
    main { max-width: 26rem; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.6rem; margin: 20px 0 8px; }
    p { margin: 0 0 12px; color: #6b6b80; font-size: 1rem; line-height: 1.6; }
    p.fa { direction: rtl; font-family: Tahoma, "Vazirmatn", sans-serif; }
    button { margin-top: 12px; padding: 12px 28px; border: 0; border-radius: 14px; background: #6c4dff; color: #fff;
      font-size: 1rem; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>English Coach needs the internet to load your practice. Check your connection and try again.</p>
    <p class="fa">اینترنت وصل نیست. اتصال را بررسی کن و دوباره امتحان کن.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
